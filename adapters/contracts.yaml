version: 2
statuses: [planned, experimental, ready, deprecated]

adapters:
  theatre-three:
    status: planned
    capabilities: [three-d, cinematography, choreography]
    primitive_ids: [camera.product-orbit]
    research_donors: [theatre, video-shotcraft]
    requirements: [threejs-runtime, deterministic-timeline, remotion-frame-binding]
    fallback: camera.parallax-2_5d

  remotion-three:
    status: experimental
    capabilities: [three-d, cinematography, choreography, remotion-engineering]
    primitive_ids: [camera.product-orbit]
    research_donors: [remotion-skills, theatre, video-shotcraft]
    source_path: adapters/remotion-three/src/orbit.ts
    smoke_test: adapters/remotion-three/test/orbit.test.ts
    proof_path: status/three-runtime.json
    implemented_features: [deterministic-orbit-math, frame-binding, real-three-studio-composition]
    readiness_gate: [composition-discovery, two-frame-render-smoke, distinct-render-hashes]
    fallback: camera.parallax-2_5d

  webgl:
    status: experimental
    capabilities: [webgl, three-d, rendering, choreography]
    primitive_ids: [webgl.shader-field]
    research_donors: [motion-skills, motion-canvas-examples, theatre, remotion-skills]
    source_path: adapters/webgl/src/shader-field.ts
    smoke_test: adapters/webgl/test/shader-field.test.ts
    proof_path: status/webgl-runtime.json
    implemented_features: [deterministic-glsl, frame-time-uniform, seed-control, real-webgl-studio-composition]
    readiness_gate: [composition-discovery, two-frame-render-smoke, distinct-render-hashes]
    fallback: static-or-css-material

  motion-canvas:
    status: planned
    capabilities: [shot-design, cinematography, data-animation]
    primitive_ids: []
    research_donors: [motion-canvas-examples]
    requirements: [technique-translation-only]
    fallback: normalized-remotion-implementation

  product-capture:
    status: experimental
    capabilities: [ui-motion, shot-design]
    primitive_ids: [ui.cursor-focus, ui.viewport-push]
    research_donors: [remotion-cinematic, video-shotcraft]
    source_path: adapters/product-capture/src/index.ts
    runner_path: apps/capture-runner/src/capture.ts
    smoke_test: adapters/product-capture/test/product-capture.test.ts
    proof_path: status/capture-runtime.json
    implemented_features: [capture-manifest-validation, privacy-gate, exact-element-anchors, deterministic-cursor-curves, playwright-browser-runner, selector-redaction, screenshot-state-export, dom-geometry-export]
    readiness_gate: [chromium-execution, interaction-state-change, privacy-manifest, screenshot-differentiation, geometry-export]
    fallback: approved-static-product-states

  audio-analysis:
    status: experimental
    capabilities: [sound-design, choreography]
    primitive_ids: [audio.beat-map, audio.impact-stack]
    research_donors: [video-shotcraft]
    source_path: adapters/audio-analysis/src/index.ts
    smoke_test: adapters/audio-analysis/test/audio-analysis.test.ts
    proof_path: status/audio-runtime.json
    implemented_features: [energy-envelope, adaptive-transient-detection, event-strength, event-to-frame-mapping]
    limitations: [not-authoritative-musical-beat-tracking, decoded-mono-float32-input]
    fallback: manual-reviewed-beat-map

adapter_template:
  status: experimental
  capabilities: []
  primitive_ids: []
  research_donors: []
  requirements: []
  fallback: null
  source_path: "adapters/<adapter-id>"
  smoke_test: null
  proof_path: null
