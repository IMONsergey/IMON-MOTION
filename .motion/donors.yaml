    role: shot-direction-and-cinematography
    priority: critical
    strengths: [shot-design, cinematography, product-capture, sequencing, camera, sound-design, qa]
    use_when: [product-launch, ui-demo, brand-film, cinematic-product]

  onda:
    repo: degueba/onda
    url: https://github.com/degueba/onda.git
    role: motion-design-system
