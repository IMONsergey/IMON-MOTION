name: IMON MOTION CI

on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout IMON MOTION
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install workspace dependencies
        run: npm install --no-audit --no-fund

      - name: Audit donor licenses and bundled assets
        run: node scripts/license-audit.mjs

      - name: Validate corpus and architecture
        run: npm run system:validate

      - name: Verify license and asset audit
        run: |
          node - <<'NODE'
          const report = require('./provenance/LICENSE-STATUS.json');
          if (report.version !== 1) throw new Error('unexpected license audit version');
          if (report.summary.donors !== 15) throw new Error(`license audit donor count mismatch: ${report.summary.donors}`);
          const allowed = new Set(['license-file-detected', 'review-required-no-license-file-detected', 'review-required-unclassified-license-file']);
          for (const [donor, source] of Object.entries(report.sources)) {
            if (!allowed.has(source.status)) throw new Error(`unexpected license status for ${donor}: ${source.status}`);
            if (source.assets.files > 0 && !source.productionPolicy.bundledAssetsRequireSeparateRightsReview) {
              throw new Error(`asset review policy missing for ${donor}`);
            }
          }
          console.log(`License audit OK: ${report.summary.withDetectedLicenseFile}/15 have detected license files; review-required=${report.summary.missingLicenseFile.length + report.summary.unclassifiedLicense.length}`);
          NODE

      - name: Typecheck normalized runtime
        run: npm run typecheck

      - name: Run routing and adapter tests
        run: npm test

      - name: Smoke-test routed product brief
        run: npm run --silent route -- "35 second premium product launch with controlled 3D orbit, UI detail and cinematic sound" > /tmp/route.json

      - name: Verify route output
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const data = JSON.parse(fs.readFileSync('/tmp/route.json', 'utf8'));
          if (data.route.brief.videoType !== 'product-launch') throw new Error('unexpected video type');
          if (data.route.brief.delivery?.durationSeconds !== 35) throw new Error('brief duration was not parsed');
          if (data.storyboard.durationInFrames !== 1050) throw new Error(`storyboard ignored 35s duration: ${data.storyboard.durationInFrames}`);
          if (!data.route.donors.includes('video-shotcraft')) throw new Error('video-shotcraft was not selected');
          if (!data.route.primitives.some((p) => p.id === 'camera.product-orbit')) throw new Error('product orbit primitive missing');
          if ((data.route.runtimeSummary?.unknown ?? []).length) throw new Error(`unknown primitive runtime status: ${data.route.runtimeSummary.unknown.join(', ')}`);
          if (!data.route.runtimeSummary?.adapterRequired?.some((p) => p.id === 'camera.product-orbit')) throw new Error('3D orbit adapter requirement was not surfaced');
          if (data.storyboard.beats.length < 5) throw new Error('storyboard skeleton too small');
          if (!data.qa || data.qa.sampleFrames.length === 0) throw new Error('QA plan missing from route output');
          if (!data.qa.finalRenderRequired) throw new Error('hero-film should require final render validation');
          console.log('Route + runtime + delivery + QA smoke test OK');
          NODE

      - name: Build bounded research context plan
        run: npm run --silent research -- "35 second premium product launch with controlled 3D orbit, UI detail and cinematic sound" > /tmp/research.json

      - name: Verify research context plan
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const data = JSON.parse(fs.readFileSync('/tmp/research.json', 'utf8'));
          if (!data.contextPolicy.normalizedFirst) throw new Error('normalized-first policy missing');
          if (!data.contextPolicy.contentAwareWithinRoutedDonors) throw new Error('content-aware routed research is disabled');
          if (data.route.donors.length < 2 || data.route.donors.length > 6) throw new Error('donor context is not bounded');
          if (!data.route.donors.includes('video-shotcraft')) throw new Error('expected cinematic research donor missing');
          if (!data.normalizedContext.includes('packages/motion-core/src/catalog.ts')) throw new Error('normalized catalog missing from context plan');
          if (!data.research.length) throw new Error('research plan is empty');
          for (const donor of data.research) {
            if (!data.route.donors.includes(donor.donor)) throw new Error(`unrouted donor leaked into research: ${donor.donor}`);
            if (donor.files.length > 7) throw new Error(`too many files selected for ${donor.donor}`);
            for (const file of donor.files) {
              if (!file.path.startsWith(`upstream/${donor.donor}/`)) throw new Error(`invalid upstream path: ${file.path}`);
            }
          }
          if (data.ignoredDonors.length === 0) throw new Error('research planner failed to exclude irrelevant donors');
          console.log('Research context smoke test OK');
          NODE

      - name: Build one-command production plan
        run: npm run --silent plan -- "35 second premium product launch with controlled 3D orbit, UI detail and cinematic sound" > /tmp/plan.json

      - name: Verify production plan
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const data = JSON.parse(fs.readFileSync('/tmp/plan.json', 'utf8'));
          if (data.version !== 1) throw new Error('unexpected planner version');
          if (data.classification.delivery?.durationSeconds !== 35) throw new Error('planner lost delivery duration');
          if (!data.blockers.some((b) => b.primitiveId === 'camera.product-orbit' && b.status === 'adapter-required')) throw new Error('planner hid 3D adapter blocker');
          if (!data.research?.research?.length) throw new Error('planner has no exact donor research');
          if (!data.qa?.finalRenderRequired) throw new Error('planner lost hero-film QA gate');
          if (!data.implementationOrder.includes('.motion/runtime-registry.yaml')) throw new Error('runtime registry missing from implementation order');
          console.log('One-command production plan OK');
          NODE

      - name: Build bounded context pack
        env:
          IMON_CONTEXT_BUDGET_BYTES: 524288
        run: npm run --silent context -- "35 second premium product launch with controlled 3D orbit, UI detail and cinematic sound" > /tmp/context.json

      - name: Verify context budget and donor isolation
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const data = JSON.parse(fs.readFileSync('/tmp/context.json', 'utf8'));
          if (data.contextBudget.usedBytes > data.contextBudget.maxBytes) throw new Error('context pack exceeded byte budget');
          if (!data.normalized.some((entry) => entry.path === '.motion/runtime-registry.yaml')) throw new Error('runtime registry missing from context pack');
          if (!data.donorExcerpts.length) throw new Error('context pack contains no donor excerpts');
          const ignored = new Set(data.ignoredDonors);
          for (const entry of data.donorExcerpts) {
            if (ignored.has(entry.donor)) throw new Error(`ignored donor leaked into context: ${entry.donor}`);
            if (!entry.path.startsWith(`upstream/${entry.donor}/`)) throw new Error(`invalid context donor path: ${entry.path}`);
          }
          if (!data.readPolicy.neverLoadIgnoredDonorWithoutRerouting) throw new Error('context isolation policy missing');
          console.log(`Context pack OK: ${data.contextBudget.usedBytes}/${data.contextBudget.maxBytes} bytes`);
          NODE

      - name: Discover normalized Remotion compositions
        shell: bash
        run: |
          set +e
          output="$(npm run --silent studio:compositions 2>&1)"
          status=$?
          printf '%s\n' "$output" | tee /tmp/compositions.txt
          if [ "$status" -ne 0 ]; then
            diagnostic="$(printf '%s' "$output" | tail -c 3500 | tr '\n' ' ' | sed 's/%/%25/g; s/\r/%0D/g; s/\n/%0A/g')"
            echo "::error title=Remotion composition discovery failed::$diagnostic"
            exit "$status"
          fi

      - name: Verify Studio composition
        run: |
          cat /tmp/compositions.txt
          grep -q "IMONSystemPreview" /tmp/compositions.txt
