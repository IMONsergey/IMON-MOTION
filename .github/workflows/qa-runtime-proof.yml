name: Record QA Runtime Proof

on:
  workflow_run:
    workflows: ["IMON MOTION QA Runtime"]
    types: [completed]

permissions:
  contents: write

jobs:
  record-proof:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current main
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Record successful QA runtime gate
        run: |
          mkdir -p status
          cat > status/qa-runtime.json <<JSON
          {
            "version": 1,
            "workflow": "IMON MOTION QA Runtime",
            "conclusion": "success",
            "run_id": ${{ github.event.workflow_run.id }},
            "tested_head_sha": "${{ github.event.workflow_run.head_sha }}",
            "tested_at": "${{ github.event.workflow_run.updated_at }}",
            "assertions": [
              "brief-derived storyboard duration matched composition duration",
              "one representative read-state frame rendered per narrative beat",
              "all representative PNG renders were non-trivial",
              "render hashes showed visual diversity",
              "QA manifest included anti-AI-slop gate"
            ]
          }
          JSON

      - name: Commit proof when changed
        run: |
          git config user.name "IMON MOTION Bot"
          git config user.email "imon-motion-bot@users.noreply.github.com"
          git add status/qa-runtime.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "chore: record successful QA runtime proof"
          git pull --rebase origin main
          git push origin HEAD:main
