name: Record Delivery Runtime Proof

on:
  workflow_run:
    workflows: ["IMON MOTION Delivery Runtime"]
    types: [completed]

permissions:
  contents: write

jobs:
  record-proof:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current main
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Record successful delivery runtime gate
        run: |
          mkdir -p status
          cat > status/delivery-runtime.json <<JSON
          {
            "version": 1,
            "workflow": "IMON MOTION Delivery Runtime",
            "conclusion": "success",
            "run_id": ${{ github.event.workflow_run.id }},
            "tested_head_sha": "${{ github.event.workflow_run.head_sha }}",
            "tested_at": "${{ github.event.workflow_run.updated_at }}",
            "assertions": [
              "production planner resolved without runtime blockers",
              "complete H.264 MP4 rendered",
              "render output exceeded minimum size",
              "SHA-256 manifest was generated",
              "delivery validation contained no failing checks"
            ]
          }
          JSON

      - name: Commit proof when changed
        run: |
          git config user.name "IMON MOTION Bot"
          git config user.email "imon-motion-bot@users.noreply.github.com"
          git add status/delivery-runtime.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "chore: record successful delivery runtime proof"
          git pull --rebase origin main
          git push origin HEAD:main
