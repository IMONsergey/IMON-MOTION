name: Record Audio Runtime Proof

on:
  workflow_run:
    workflows: ["IMON MOTION Audio Runtime"]
    types: [completed]

permissions:
  contents: write

jobs:
  record-proof:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current main
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Record successful audio runtime gate
        run: |
          mkdir -p status
          cat > status/audio-runtime.json <<JSON
          {
            "version": 1,
            "workflow": "IMON MOTION Audio Runtime",
            "conclusion": "success",
            "run_id": ${{ github.event.workflow_run.id }},
            "tested_head_sha": "${{ github.event.workflow_run.head_sha }}",
            "tested_at": "${{ github.event.workflow_run.updated_at }}",
            "assertions": [
              "audio adapter TypeScript passed",
              "synthetic transient detection passed",
              "event-to-Remotion-frame mapping passed",
              "strongest-event selection passed"
            ],
            "readiness_note": "Experimental onset analysis is verified; musical beat/tempo truth still requires review."
          }
          JSON

      - name: Commit proof when changed
        run: |
          git config user.name "IMON MOTION Bot"
          git config user.email "imon-motion-bot@users.noreply.github.com"
          git add status/audio-runtime.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "chore: record successful audio runtime proof"
          git pull --rebase origin main
          git push origin HEAD:main
