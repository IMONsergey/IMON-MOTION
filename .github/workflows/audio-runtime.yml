name: IMON MOTION Audio Runtime

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - adapters/audio-analysis/**
      - .github/workflows/audio-runtime.yml

permissions:
  contents: read

jobs:
  audio-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout IMON MOTION
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install workspace dependencies
        run: npm install --no-audit --no-fund

      - name: Typecheck audio adapter
        run: npm run typecheck

      - name: Test deterministic transient and frame mapping
        run: node --import tsx --test adapters/audio-analysis/test/*.test.ts
