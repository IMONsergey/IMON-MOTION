name: Integrate IMON MOTION v0.2 Runtime Surface

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/v02-integration.yml

permissions:
  contents: write

concurrency:
  group: imon-motion-v02-integration
  cancel-in-progress: false

jobs:
  integrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout current main
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Integrate root commands and tests
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          pkg.version = '0.2.0';
          pkg.scripts = {
            ...pkg.scripts,
            'license:audit': 'node scripts/license-audit.mjs',
            'route': 'tsx scripts/route.mts',
            'research': 'tsx scripts/research.mts',
            'plan:base': 'tsx scripts/plan.mts',
            'shot:plan': 'tsx scripts/shot-plan.mts',
            'plan': 'tsx scripts/production-plan.mts',
            'context': 'tsx scripts/context.mts',
            'scaffold': 'tsx scripts/scaffold.mts',
            'qa:render': 'tsx scripts/render-qa.mts',
            'delivery:render': 'tsx scripts/render-delivery.mts',
            'health': 'node scripts/health-v2.mjs',
            'system:validate': 'node scripts/validate-system.mjs',
            'extensions:validate': 'node scripts/validate-extensions.mjs',
            'validate:v02': 'node scripts/validate-v02.mjs',
            'studio': 'npm run studio -w @imon-motion/studio',
            'studio:compositions': 'npm run compositions -w @imon-motion/studio',
            'three:compositions': 'npm run compositions -w @imon-motion/three-studio',
            'webgl:compositions': 'npm run compositions -w @imon-motion/webgl-studio',
            'capture': 'npm run capture -w @imon-motion/capture-runner --',
            'typecheck': 'tsc --noEmit',
            'test': 'node --import tsx --test packages/motion-core/test/*.test.ts adapters/product-capture/test/*.test.ts adapters/remotion-three/test/*.test.ts adapters/audio-analysis/test/*.test.ts adapters/webgl/test/*.test.ts',
            'ci': 'npm run license:audit && npm run system:validate && npm run extensions:validate && npm run validate:v02 && npm run typecheck && npm test && npm run studio:compositions'
          };
          fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
          NODE

      - name: Make generated data-story copy JSX-safe
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const file = 'scripts/scaffold.mts';
          let text = fs.readFileSync(file, 'utf8');
          const from = ">${titleFromBrief.replace(/[&<>]/g, '')}</div>";
          const to = ">{${escapeTs(titleFromBrief)}}</div>";
          if (text.includes(from)) text = text.replace(from, to);
          fs.writeFileSync(file, text);
          NODE

      - name: Replace legacy health workflow with v2 readiness aggregation
        run: |
          rm -f .github/workflows/health-report.yml
          cat > .github/workflows/health-v2-report.yml <<'YAML'
          name: Refresh IMON MOTION Health v2

          on:
            workflow_dispatch:
            workflow_run:
              workflows:
                - "Record Core CI Proof"
                - "Record Three Runtime Proof"
                - "Record Capture Runtime Proof"
                - "Record QA Runtime Proof"
                - "Record Audio Runtime Proof"
                - "Record WebGL Runtime Proof"
                - "Record Delivery Runtime Proof"
              types: [completed]

          permissions:
            contents: write

          concurrency:
            group: imon-motion-health-v2
            cancel-in-progress: true

          jobs:
            refresh-health:
              runs-on: ubuntu-latest
              steps:
                - name: Checkout current main
                  uses: actions/checkout@v7
                  with:
                    ref: main
                    fetch-depth: 0

                - name: Build consolidated readiness report
                  run: |
                    mkdir -p status
                    node scripts/health-v2.mjs > status/health.json
                    node -e "const h=JSON.parse(require('fs').readFileSync('status/health.json','utf8')); if(h.version!==2) process.exit(1); console.log('health v2 JSON OK')"

                - name: Commit health when changed
                  run: |
                    git config user.name "IMON MOTION Bot"
                    git config user.email "imon-motion-bot@users.noreply.github.com"
                    git add status/health.json
                    if git diff --cached --quiet; then exit 0; fi
                    git commit -m "chore: refresh IMON MOTION runtime health v2"
                    git pull --rebase origin main
                    git push origin HEAD:main
          YAML

      - name: Refresh lockfile for all current workspaces
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Validate integrated surface
        run: |
          npm run validate:v02
          node - <<'NODE'
          const p = require('./package.json');
          for (const key of ['plan','shot:plan','context','scaffold','qa:render','delivery:render','health','validate:v02']) {
            if (!p.scripts[key]) throw new Error(`missing script ${key}`);
          }
          if (!p.scripts.plan.includes('production-plan.mts')) throw new Error('plan is not director-aware v2');
          if (!p.scripts.test.includes('audio-analysis') || !p.scripts.test.includes('webgl') || !p.scripts.test.includes('remotion-three') || !p.scripts.test.includes('product-capture')) throw new Error('root test surface is incomplete');
          NODE

      - name: Commit integrated v0.2 surface
        run: |
          git config user.name "IMON MOTION Bot"
          git config user.email "imon-motion-bot@users.noreply.github.com"
          git add package.json package-lock.json scripts/scaffold.mts .github/workflows/health-v2-report.yml
          git add -u .github/workflows/health-report.yml || true
          if git diff --cached --quiet; then
            echo "v0.2 runtime surface is already integrated."
            exit 0
          fi
          git commit -m "chore: integrate IMON MOTION v0.2 production surface"
          git pull --rebase origin main
          git push origin HEAD:main
